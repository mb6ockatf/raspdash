# dependabot.yml - keep the actions used by the workflows up to date.
#
# Copyright (C) 2026 mb6ockatf
# This file is free software; see COPYING for copying conditions.
#
# GitHub retires old action runtimes (Node 20 was removed from the
# hosted runners on 2026-09-16), so stale major versions stop working.
# All updates arrive grouped in one weekly pull request.  The container
# images named in the workflows (gcc:16.2-trixie, ...) are not covered.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: CI

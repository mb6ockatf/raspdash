# Alacritty configuration for the raspdash kiosk window.
# Kept separate from ~/.alacritty.yml so the user's own terminal is
# unaffected.  YAML because the Pi runs alacritty 0.13.0-dev (pre-TOML).
env:
  TERM: xterm-256color
  LANG: C.UTF-8
window:
  startup_mode: Fullscreen
  decorations: none
  padding:
    x: 4
    y: 2
  title: raspdash
  dynamic_title: false
font:
  normal:
    family: DejaVuSansM Nerd Font Mono
  size: 11.0
mouse:
  hide_when_typing: true
colors:
  primary:
    background: '#0b0f14'
    foreground: '#c9d1d9'
